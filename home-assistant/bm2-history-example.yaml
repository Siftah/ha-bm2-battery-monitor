# Merge this block into Home Assistant's configuration.yaml.
# Replace/add voltage_sources with the actual voltage entity IDs of ALL receivers.
bm2_history:
  offline_after: 180
  sync_interval: 3600
  batteries:
    rangerover_starter:
      name: Range Rover Starter Battery
      mac_address: "AA:BB:CC:DD:EE:01"
      voltage_sources:
        - sensor.rr_monitor_rangerover_starter_battery_voltage
    porsche_starter:
      name: Porsche Starter Battery
      mac_address: "AA:BB:CC:DD:EE:02"
      voltage_sources:
        - sensor.rr_monitor_porsche_starter_battery_voltage

